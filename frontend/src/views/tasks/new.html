{% extends "layout.html" %}

{% block title %}Create task — HMCTS Task Manager{% endblock %}

{% block content %}
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <h1 class="govuk-heading-l">Create a new task</h1>

      {% if errors %}
        <div class="govuk-error-summary" data-module="govuk-error-summary">
          <div role="alert">
            <h2 class="govuk-error-summary__title">There is a problem</h2>
            <ul class="govuk-list govuk-error-summary__list">
              {% for error in errors %}
                <li>{{ error }}</li>
              {% endfor %}
            </ul>
          </div>
        </div>
      {% endif %}

      <form method="post" action="/tasks">
        <div class="govuk-form-group">
          <label class="govuk-label" for="title">Title</label>
          <input class="govuk-input" id="title" name="title" type="text" value="{{ values.title }}" required>
        </div>

        <div class="govuk-form-group">
          <label class="govuk-label" for="description">Description</label>
          <textarea class="govuk-textarea" id="description" name="description" rows="3" required>{{ values.description }}</textarea>
        </div>

        <div class="govuk-form-group">
          <label class="govuk-label" for="status">Status</label>
          <select class="govuk-select" id="status" name="status">
            <option value="pending" {% if values.status === 'pending' %}selected{% endif %}>Pending</option>
            <option value="in_progress" {% if values.status === 'in_progress' %}selected{% endif %}>In progress</option>
            <option value="done" {% if values.status === 'done' %}selected{% endif %}>Done</option>
          </select>
        </div>

        <div class="govuk-form-group">
          <label class="govuk-label" for="due_date">Due date and time</label>
          <input class="govuk-input" id="due_date" name="due_date" type="datetime-local" value="{{ values.due_date }}" required>
        </div>

        <button type="submit" class="govuk-button">Create task</button>
        <a href="/tasks" class="govuk-link govuk-!-margin-left-3">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
