services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hmcts
      POSTGRES_PASSWORD: hmcts
      POSTGRES_DB: tasks_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmcts -d tasks_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://hmcts:hmcts@db:5432/tasks_db
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3100:3100"
    environment:
      BACKEND_API_URL: http://backend:8000
      PORT: 3100
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  postgres_data:
